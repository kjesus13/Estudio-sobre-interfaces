/* ======================================================
   CREAR OPCIONES
   ====================================================== */

function crearOpciones(
  nombre,
  opciones
) {

  return opciones
    .map(
      opcion => `

        <label class="option">

          <input
            type="radio"
            name="${nombre}"
            value="${opcion}"
          >

          ${opcion}

        </label>

      `
    )
    .join("");
}


/* ======================================================
   CREAR ESCALA 1–5
   ====================================================== */

function crearEscala(
  nombre
) {

  let html =
    `<div class="scale">`;

  for (
    let i = 1;
    i <= 5;
    i++
  ) {

    html += `

      <label>

        <input
          type="radio"
          name="${nombre}"
          value="${i}"
        >

        ${i}

      </label>

    `;
  }

  html += `
    </div>
  `;

  return html;
}


/* ======================================================
   LEER RADIO
   ====================================================== */

function leerRadio(
  nombre
) {

  const elemento =
    document.querySelector(
      `input[name="${nombre}"]:checked`
    );

  return elemento
    ? elemento.value
    : null;
}


/* ======================================================
   GUARDAR CUESTIONARIO
   SOLO LOCALMENTE DE MOMENTO
   ====================================================== */

async function guardarCuestionarioLocal() {

  const campos = [
    "edad",
    "experiencia",
    "frecuencia",
    "conocimiento",
    "p5",
    "p6",
    "p7",
    "p8"
  ];

  const respuestas = {};

  for (const campo of campos) {

    const valor =
      leerRadio(campo);

    if (!valor) {

      alert(
        "Por favor, responde a todas las preguntas antes de continuar."
      );

      return;
    }

    respuestas[campo] = valor;
  }

  // Consentimiento
  respuestas.consentimiento = "Sí";

  // Guardamos localmente
  datosParticipante = respuestas;

  // Mostrar estado de carga
  document.getElementById("app").innerHTML = `

    <div class="loading">

      <p>
        Guardando tus respuestas...
      </p>

    </div>

  `;

  try {

    await fetch(
      API_URL,
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body: JSON.stringify({

          tipo:
            "cuestionario",

          sessionId:
            sessionId,

          ...respuestas

        })
      }
    );

    // -----------------------------------------
    // Una vez enviado:
    // mostrar puente
    // -----------------------------------------

    mostrarPuente();

  }

  catch (error) {

    document.getElementById("app").innerHTML = `

      <h2>
        No se han podido guardar las respuestas
      </h2>

      <p>
        Comprueba tu conexión a Internet e inténtalo de nuevo.
      </p>

      <button onclick="mostrarCuestionario()">
        Volver al cuestionario

    `;

  }
}

async function comenzarExperimento() {

  document.getElementById("app").innerHTML = `

  try {

    const response = await fetch(
      API_URL +

    const data = await response.json();

    if (!data.ok) {

      document.getElementById("app").innerHTML = `
        <h2>No se ha podido iniciar el estudio</h2>
        <p>${data.error}</p>
        <button onclick="mostrarPuente()">Volver a intentar</button>

    condicion = data.condicion;

    mostrarEscenario();

  } catch (error) {

    document.getElementById("app").innerHTML = `
      <h2>No se ha podido conectar con el servidor</h2>
      <p>Comprueba la conexión a Internet e inténtalo de nuevo.</p>
      <button onclick="mostrarPuente()">Volver a intentar</button>
    `;
  }
}

/* ======================================================
   MOSTRAR ESCENARIO
   ====================================================== */

function mostrarEscenario() {

  window.scrollTo(0, 0);

  const partes =
    condicion.split("_");

  const interfaz =
    partes[0];

  const orden =
    partes[1];


  const secuencia =
    orden === "AB"
      ? ["A", "B"]
      : ["B", "A"];


  if (
    indiceEscenario >=
    secuencia.length
  ) {

  mostrarNASA_TLX();
    
    return;
  }


  const escenario =
    secuencia[indiceEscenario];

  escenarioActual = escenario; // "A" o "B"


  const datos =
    escenarios[escenario];


  inicioEscenario =
    Date.now();


  document.getElementById("app").innerHTML = `

    <h1>
      ${datos.titulo}
    </h1>

    <p>
      ${datos.contexto}
    </p>

    <div
      class="image-container"
    >

        src="${datos.imagen[interfaz]}"

      >

    <button
      onclick="guardarEscenario()"
    >
      Continuar
    </button>

  `;


  mostrarPreguntas(
    escenario,
    datos.opciones
  );

  window.scrollTo(0, 0);
  
}

      </div>

/* ======================================================
   GUARDAR ESCENARIO
   ====================================================== */

async function guardarEscenario() {

  const comprension = leerRadio("comprension");
  const interpretacion = leerRadio("interpretacion");
  const decision = leerRadio("decision");
  const confianza = leerRadio("confianza");
  const esfuerzo = leerRadio("esfuerzo");

  if (!comprension || !interpretacion || !decision || !confianza || !esfuerzo) {
    alert("Por favor, responde a todas las preguntas antes de continuar.");
    return;
  }

  const tiempo = Math.round((Date.now() - inicioEscenario) / 1000);
  const sufijo = escenarioActual; // "A" o "B"

  const payload = {
    tipo: "escenario",
    sessionId: sessionId
  };

  payload["tiempo" + sufijo] = tiempo;
  payload["comprension" + sufijo] = comprension;
  payload["interpretacion" + sufijo] = interpretacion;
  payload["decision" + sufijo] = decision;
  payload["confianza" + sufijo] = confianza;
  payload["esfuerzo" + sufijo] = esfuerzo;

  // Deshabilita el botón para evitar doble envío
  const boton = document.querySelector("button[onclick='guardarEscenario()']");
  if (boton) {
    boton.disabled = true;
    boton.textContent = "Guardando...";
  }

  try {

    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

  } catch (error) {

    alert("No se ha podido guardar tu respuesta. Comprueba tu conexión e inténtalo de nuevo.");
    if (boton) {
      boton.disabled = false;
      boton.textContent = "Continuar";
    }
    return;
  }

  indiceEscenario++;
  mostrarEscenario();
}

let slidersInteractuados = new Set();

  `;

function crearEscala100(nombre) {

  return `

    <div style="margin-top: 12px;">

      <input
        type="range"
        min="0"
        max="100"
        step="1"
        value="50"
        id="${nombre}"
        style="width: 100%;"
      >

      <div style="
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: #64748B;
        margin-top: 6px;
      ">
        <span>0 — Muy bajo</span>
        <span>Valor: <strong id="${nombre}_valor">Sin ajustar</strong></span>
        <span>100 — Muy alto</span>
      </div>

    </div>

  `;
}

document.addEventListener("input", function(event) {

  if (event.target.matches('input[type="range"]')) {

    const id = event.target.id;

    slidersInteractuados.add(id);

    const valor = document.getElementById(id + "_valor");

    if (valor) {
      valor.textContent = event.target.value;
    }
  }

});

async function guardarNASA_TLX() {

  const nombres = [
    "tlx_mental",
    "tlx_fisica",
    "tlx_tiempo",
    "tlx_rendimiento",
    "tlx_esfuerzo",
    "tlx_frustracion"
  ];

  const faltantes = nombres.filter(
    nombre => !slidersInteractuados.has(nombre)
  );

  if (faltantes.length > 0) {
    alert("Por favor, ajusta todas las barras antes de continuar.");
    return;
  }

  const valores = {};

  nombres.forEach(nombre => {
    valores[nombre] = Number(
      document.getElementById(nombre).value
    );
  });

  const media = nombres.reduce(
    (suma, nombre) => suma + valores[nombre], 0
  ) / nombres.length;

  const nasaTLX = Number(media.toFixed(2));

  document.getElementById("app").innerHTML = `
    <div class="loading"><p>Guardando evaluación...</p></div>
  `;

  try {

    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        tipo: "nasa_tlx",
        sessionId: sessionId,
        tlxMental: valores.tlx_mental,
        tlxFisica: valores.tlx_fisica,
        tlxTiempo: valores.tlx_tiempo,
        tlxRendimiento: valores.tlx_rendimiento,
        tlxEsfuerzo: valores.tlx_esfuerzo,
        tlxFrustracion: valores.tlx_frustracion,
        nasaTLX: nasaTLX
      })
    });

    mostrarSUS();

  } catch (error) {

    document.getElementById("app").innerHTML = `
      <h2>No se ha podido guardar la evaluación</h2>
      <p>Comprueba tu conexión a Internet e inténtalo de nuevo.</p>
      <button onclick="mostrarNASA_TLX()">Volver a intentar</button>
    `;
  }
}

/* ======================================================
   SUS (System Usability Scale)
   ====================================================== */

function mostrarSUS() {

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  const preguntas = [

    "Creo que utilizaría esta interfaz con frecuencia.",

    "Encontré la interfaz innecesariamente compleja.",

    "Me pareció fácil utilizar la interfaz.",

    "Creo que necesitaría ayuda de una persona técnica para poder utilizar esta interfaz.",

    "Las distintas funciones de la interfaz estaban bien integradas.",

    "Encontré demasiadas inconsistencias en la interfaz.",

    "Creo que la mayoría de las personas aprenderían a utilizar esta interfaz rápidamente.",

    "Me pareció muy complicada de utilizar.",

    "Me sentí muy seguro/a utilizando la interfaz.",

    "Necesitaría aprender muchas cosas antes de poder utilizar esta interfaz."
  ];

  document.getElementById("app").innerHTML = `

    <h1>
      Evaluación final
    </h1>

    <p>
      Indica hasta qué punto estás de acuerdo o en desacuerdo
      con cada afirmación.
    </p>

    ${preguntas
      .map(
        (pregunta, i) => `

          <div class="question">

            <div class="question-title">
              ${i + 1}. ${pregunta}
            </div>

            ${crearOpciones(
              "sus_" + (i + 1),
              [
                "1 — Totalmente en desacuerdo",
                "2 — En desacuerdo",
                "3 — Neutral",
                "4 — De acuerdo",
                "5 — Totalmente de acuerdo"
              ]
            )}

          </div>

        `
      )
      .join("")}

    <button
      onclick="guardarSUS()"
    >
      Finalizar estudio
    </button>

  `;
}

async function guardarSUS() {

  const valores = [];

  for (let i = 1; i <= 10; i++) {

    const valor = leerRadio("sus_" + i);

    if (!valor) {
      alert("Por favor, responde a todas las afirmaciones antes de finalizar.");
      return;
    }

    valores.push(Number(valor.split(" ")[0]));
  }

  /*
   * Cálculo SUS
   * Preguntas impares: respuesta - 1
   * Preguntas pares: 5 - respuesta
   */

  let suma = 0;

  for (let i = 0; i < 10; i++) {

    if (i % 2 === 0) {
      suma += valores[i] - 1;
    } else {
      suma += 5 - valores[i];
    }
  }

  const sus = Number((suma * 2.5).toFixed(2));

  document.getElementById("app").innerHTML = `
    <div class="loading"><p>Guardando evaluación...</p></div>
  `;

  try {

    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        tipo: "sus",
        sessionId: sessionId,
        sus: sus,
        estado: "Completado"
      })
    });

    finalizarExperimento();

  } catch (error) {

    document.getElementById("app").innerHTML = `
      <h2>No se ha podido finalizar el estudio</h2>
      <p>Comprueba tu conexión a Internet e inténtalo de nuevo.</p>
      <button onclick="mostrarSUS()">Volver a intentar</button>
    `;
  }
}


/* ======================================================
   FINAL
   ====================================================== */

async function finalizarExperimento() {

  sessionStorage.setItem("experimentoFinalizado", "true");
  history.pushState(null, "", location.href);

  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        sessionId: sessionId,
        estado: "Completado"
      })
    });
  } catch (error) {
    // No bloqueamos el mensaje de agradecimiento aunque falle
  }

  document.getElementById("app").innerHTML = `
    <h1>Gracias por participar</h1>
    <p>Has completado correctamente el estudio.</p>
    <p>Ya puedes cerrar esta página.</p>
  `;
}


window.addEventListener(
  "popstate",
  function() {

    if (

    ) {

      history.pushState(

        "",
        location.href

      mostrarFinalBloqueado();

);

function mostrarFinalBloqueado() {

  document.getElementById("app").innerHTML = `

    <h1>
      Gracias por participar
    </h1>

    <p>
      Has completado correctamente el estudio.
    </p>

    <p>
      Ya puedes cerrar esta página.
    </p>

  `;

}


/* ======================================================

if (
  sessionStorage.getItem(
    "experimentoFinalizado"
  ) === "true"
) {

  mostrarFinalBloqueado();

} else {

}
