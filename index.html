<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prueba TFM</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      background: #F5F7FA;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #1F2937;
    }

    .container {

      width: 100%;

      max-width: 700px;

      margin: 0 auto;

      padding: 20px 16px 40px;
    }

    .card {

      background: #FFFFFF;

      border-radius: 16px;

      padding: 28px;

      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, 0.06);
    }

    h1 {

      margin-top: 0;

      font-size: 26px;
    }

    button {

      width: 100%;

      padding: 14px;

      margin-top: 20px;

      background: #2563EB;

      color: white;

      border: none;

      border-radius: 8px;

      font-size: 16px;
    }

    #resultado {

      margin-top: 20px;

      padding: 14px;

      border-radius: 8px;

      background: #F1F5F9;

    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      Prueba de conexión
    </h1>

    <p>
      Esta página está alojada en GitHub Pages.
      Apps Script funciona como backend.
    </p>

    <button
      onclick="probarConexion()"
    >
      Probar conexión
    </button>

    <div id="resultado"></div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzHglXr5umt_xV6vFsOLhRozPojW928Un9LmPP8BFdjuft6kic_J0Q9ZHS4E9-CMjhhew/exec";


function probarConexion() {

  const callbackName =
    "respuesta_" +
    Date.now();

  const script =
    document.createElement("script");

  script.src =
    API_URL +
    "?action=ping" +
    "&callback=" +
    callbackName;

  window[callbackName] =
    function(data) {

      const resultado =
        document.getElementById(
          "resultado"
        );

      if (data.ok) {

        resultado.textContent =
          data.message;

      } else {

        resultado.textContent =
          "Error: " +
          data.error;
      }

      delete window[callbackName];

      script.remove();
    };


  script.onerror =
    function() {

      document.getElementById(
        "resultado"
      ).textContent =
        "No se ha podido conectar con Apps Script.";

      delete window[callbackName];

      script.remove();

    };


  document.head.appendChild(script);

}

</script>

</body>

</html>
