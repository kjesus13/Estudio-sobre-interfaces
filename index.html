<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Estudio TFM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #F5F7FA;
      font-family: Arial, Helvetica, sans-serif;
      color: #1F2937;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563EB;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>
        Prueba de acceso al estudio
      </h1>

      <p>
        Esta es una página de prueba para comprobar
        el acceso desde dispositivos móviles.
      </p>

      <button>
        Continuar
      </button>

    </div>

  </div>

</body>

</html>
